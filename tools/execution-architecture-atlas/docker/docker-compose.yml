version: "3.9"

services:
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: execution-architecture-atlas-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "14268:14268"
      - "4317:4317"
      - "4318:4318"
